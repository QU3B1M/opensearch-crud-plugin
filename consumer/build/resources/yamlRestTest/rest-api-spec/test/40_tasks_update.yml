"Test consumer update - Only title":
  - do:
      _plugins.consumer_create:
        body: { title: test }

  - do:
      _plugins.consumer_update:
        id: test
        body: { title: test_two }
  - match: { result: updated }
  - match: { _shards.failed: 0 }

  - do:
      _plugins.consumer_read:
        id: test
  - match: { found: true }
  - match: { _source.title: test_two }
  - match: { _source.description: "" }
  - match: { _source.status: PENDING }

