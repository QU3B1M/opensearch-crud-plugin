"Test consumer creation - Only title":
  - do:
      _plugins.consumer_create:
        body: { title: test }
  - match: { result: created }
  - match: { _shards.failed: 0 }

  - do:
      _plugins.consumer_read:
        id: test
  - match: { found: true }
  - match: { _source.title: test }
  - match: { _source.description: "" }
  - match: { _source.status: PENDING }

---

"Test consumer creation - Title and description":
  - do:
      _plugins.consumer_create:
        body: { title: test, description: test }
  - match: { result: created }
  - match: { _shards.failed: 0 }

  - do:
      _plugins.consumer_read:
        id: test
  - match: { found: true }
  - match: { _source.title: test }
  - match: { _source.description: test }
  - match: { _source.status: PENDING }

---

"Test consumer creation - Title, description and status":
  - do:
      _plugins.consumer_create:
          body: { title: test, description: test, status: IN_PROGRESS }
  - match: { result: created }
  - match: { _shards.failed: 0 }

  - do:
      _plugins.consumer_read:
        id: test
  - match: { found: true }
  - match: { _source.title: test }
  - match: { _source.description: test }
  - match: { _source.status: IN_PROGRESS }
